<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#070a10">
<title>SCI FUN RACE PART 2 2027 — All Games Completed</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;width:100%;min-height:100%}
body{
  background:
    radial-gradient(circle at 20% 15%, rgba(250,204,21,.18), transparent 42%),
    radial-gradient(circle at 85% 20%, rgba(34,197,94,.18), transparent 42%),
    radial-gradient(circle at 50% 90%, rgba(59,130,246,.16), transparent 45%),
    #070a10;
  color:#fff;font-family:Arial,Helvetica,sans-serif;
  min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:32px 20px;text-align:center;
}
.badge{
  display:inline-flex;align-items:center;gap:8px;border:1px solid rgba(250,204,21,.55);
  background:rgba(250,204,21,.08);border-radius:999px;padding:7px 16px;
  font-size:11px;letter-spacing:2px;color:#fde68a;font-weight:800;margin-bottom:18px;
}
.trophyIcon{font-size:clamp(70px,20vw,110px);animation:popIn .6s ease, floatUp 2.4s ease-in-out infinite}
@keyframes popIn{0%{transform:scale(.3);opacity:0}60%{transform:scale(1.15);opacity:1}100%{transform:scale(1)}}
@keyframes floatUp{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
h1{
  font-size:clamp(26px,7.5vw,40px);font-weight:900;letter-spacing:1px;
  margin:12px 0 8px;color:#4ade80;
}
.sub{color:#c7cfdd;font-size:15px;line-height:1.6;max-width:380px;margin-bottom:28px}

.showStaffBox{
  background:rgba(74,222,128,.1);border:1.5px solid rgba(74,222,128,.5);
  border-radius:16px;padding:18px 20px;font-size:14px;color:#bbf7d0;font-weight:700;
  line-height:1.6;max-width:380px;
}
.qrBox{
  background:rgba(59,130,246,.1);border:1.5px solid rgba(59,130,246,.5);
  border-radius:16px;padding:18px;max-width:340px;
}
.qrLabel{font-size:13px;font-weight:800;color:#bfdbfe;margin-bottom:12px}
.qrImg{width:180px;height:180px;border-radius:12px;background:#fff;padding:8px;display:block;margin:0 auto}
.qrFallback{color:#fca5a5;font-size:12px;padding:20px}
.qrSub{font-size:12px;color:#93c5fd;margin-top:12px}
.qrLink{display:inline-block;margin-top:10px;font-size:12px;color:#60a5fa;text-decoration:underline}

.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:-1}
.confettiPiece{
  position:absolute;top:-20px;width:8px;height:14px;border-radius:2px;
  animation:confettiFall linear forwards;
}
@keyframes confettiFall{
  0%{transform:translateY(-20px) rotate(0deg);opacity:1}
  100%{transform:translateY(110vh) rotate(600deg);opacity:.4}
}
</style>
</head>
<body>
<div class="confetti" id="confetti"></div>

<span class="badge">🏁 SCI FUN RACE PART 2 2027</span>
<div class="trophyIcon">🏆</div>
<h1>ALL GAMES COMPLETED!</h1>
<div class="sub">Every challenge in the chain is done. Amazing teamwork from your whole team!</div>

<div id="chainBox">
  <div class="showStaffBox">📱 Show this screen to a staff member to get your final password.</div>
</div>

<script src="config.js"></script>
<script src="chain-logic.js"></script>
<script>
// This page isn't a game to "win" — it's the finish line. It shows the
// celebration immediately, then reuses the same chain-logic used by
// every other game so the ending stays consistent: if this page is
// (still) the LAST entry in GAME_ORDER, it shows the staff message; if
// you ever add another stage after it in config.js, it will
// automatically switch to a QR code for that next stage instead — no
// changes needed here.
function launchConfetti(){
  const colours=["#facc15","#22c55e","#3b82f6","#ef4444","#a855f7","#f97316"];
  const el=document.getElementById("confetti");
  for(let i=0;i<60;i++){
    const piece=document.createElement("div");
    piece.className="confettiPiece";
    piece.style.left=Math.random()*100+"vw";
    piece.style.background=colours[Math.floor(Math.random()*colours.length)];
    piece.style.animationDuration=(2.5+Math.random()*2)+"s";
    piece.style.animationDelay=(Math.random()*1.2)+"s";
    el.appendChild(piece);
  }
}

launchConfetti();
renderChainBox("chainBox");
</script>
</body>
</html>
